<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- No network access at all: the diary can never leave this page unencrypted. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Encrypted Notebook</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='6' y='14' width='20' height='15' rx='3' fill='%233c6e71'/%3E%3Cpath d='M11 14v-4a5 5 0 0 1 10 0v4' fill='none' stroke='%233c6e71' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="brand-icon" viewBox="0 0 32 32" aria-hidden="true"><rect x="6" y="14" width="20" height="15" rx="3"/><path d="M11 14v-4a5 5 0 0 1 10 0v4"/></svg>
      <div>
        <div class="brand-name">Encrypted Notebook</div>
        <div class="file-line"><span id="fileName">Untitled</span><span id="dirty" class="dirty" hidden title="Unsaved changes">●</span> <span id="cryptoStatus" class="crypto-status"></span></div>
      </div>
    </div>

    <nav class="tabs" role="tablist">
      <button role="tab" id="tabDiary" aria-selected="true" data-view="diary">Diary</button>
      <button role="tab" id="tabReflect" aria-selected="false" data-view="reflect">Work through thoughts</button>
      <button role="tab" id="tabEmotions" aria-selected="false" data-view="emotions">Emotions</button>
      <button role="tab" id="tabBeliefs" aria-selected="false" data-view="beliefs">Beliefs</button>
    </nav>

    <div class="actions">
      <button id="btnNew" title="New notebook">New</button>
      <button id="btnOpen" title="Open an encrypted file (Ctrl+O)">Open</button>
      <button id="btnSave" class="primary" title="Encrypt and save (Ctrl+S)">Save</button>
      <button id="btnSaveAs" title="Save to a new file, password or format">Save as…</button>
      <button id="btnLock" title="Clear the notebook and key from this page">Lock</button>
    </div>
    <nav class="lang" aria-label="Language">
      <a href="index.html" hreflang="en" lang="en" title="English" aria-current="page">
        <svg class="flag" viewBox="0 0 190 100" width="32" height="17" aria-hidden="true">
          <rect width="190" height="100" fill="#fff"/>
          <path fill="#b22234" d="M0 0h190v7.7H0zM0 15.4h190v7.7H0zM0 30.8h190v7.7H0zM0 46.2h190v7.7H0zM0 61.5h190v7.7H0zM0 76.9h190v7.7H0zM0 92.3h190v7.7H0z"/>
          <rect width="76" height="53.8" fill="#3c3b6e"/>
          <g fill="#fff"><circle cx="9" cy="8" r="2.6"/><circle cx="24" cy="8" r="2.6"/><circle cx="39" cy="8" r="2.6"/><circle cx="54" cy="8" r="2.6"/><circle cx="68" cy="8" r="2.6"/><circle cx="16" cy="19" r="2.6"/><circle cx="31" cy="19" r="2.6"/><circle cx="46" cy="19" r="2.6"/><circle cx="61" cy="19" r="2.6"/><circle cx="9" cy="30" r="2.6"/><circle cx="24" cy="30" r="2.6"/><circle cx="39" cy="30" r="2.6"/><circle cx="54" cy="30" r="2.6"/><circle cx="68" cy="30" r="2.6"/><circle cx="16" cy="41" r="2.6"/><circle cx="31" cy="41" r="2.6"/><circle cx="46" cy="41" r="2.6"/><circle cx="61" cy="41" r="2.6"/></g>
        </svg>
        <span class="sr-only">English</span>
      </a>
      <a href="pt-BR/index.html" hreflang="pt-BR" lang="pt-BR" title="Português (Brasil)">
        <svg class="flag" viewBox="0 0 100 70" width="24" height="17" aria-hidden="true">
          <rect width="100" height="70" fill="#009c3b"/>
          <polygon points="8.5,35 50,8.5 91.5,35 50,61.5" fill="#ffdf00"/>
          <clipPath id="brDisc"><circle cx="50" cy="35" r="17.5"/></clipPath>
          <circle cx="50" cy="35" r="17.5" fill="#002776"/>
          <path d="M31 30 Q52 25 70 39" stroke="#fff" stroke-width="3.2" fill="none" clip-path="url(#brDisc)"/>
        </svg>
        <span class="sr-only">Português (Brasil)</span>
      </a>
    </nav>
  </header>

  <div id="banner" class="banner" hidden>
    <span id="bannerText"></span>
    <span class="banner-actions">
      <button id="btnResume" class="primary">Unlock</button>
      <button id="btnForget">Forget it</button>
    </span>
  </div>

  <main>
    <section id="diaryView" class="view">
      <aside class="reflect-list">
        <button id="btnNewEntry" class="primary block">+ New entry</button>
        <ol id="entryList" aria-label="Diary entries"></ol>
      </aside>
      <div class="diary-main">
      <div class="entry-head">
        <h2 id="entryDate" class="entry-date"></h2>
        <button id="btnDeleteEntry" class="link danger-link">Delete entry</button>
      </div>
      <div class="editor-bar">
        <label class="check"><input type="checkbox" id="optBrowserCopy"> Keep an encrypted copy in this browser</label>
        <span id="wordCount" class="muted"></span>
      </div>
      <textarea id="editor" spellcheck="true" placeholder="Write freely. Nothing leaves this page unencrypted.&#10;&#10;When you're ready, open “Work through thoughts” to break an entry into individual thoughts and bring each one through the Instrument for Peace."></textarea>
      </div>
    </section>

    <section id="reflectView" class="view" hidden>
      <aside class="reflect-list">
        <button id="btnNewReflection" class="primary block">+ New reflection</button>
        <ol id="reflectionList"></ol>
      </aside>
      <div id="reflectMain" class="reflect-main"></div>
    </section>

    <section id="emotionsView" class="view" hidden></section>
    <section id="beliefsView" class="view" hidden></section>
  </main>

  <footer class="footer">
    Everything is encrypted on your device (AES-256-GCM) — nothing is ever sent to a server.
    · Worksheet: <a id="sourceLink" target="_blank" rel="noopener noreferrer">Instrument for Peace</a> by David Hoffmeister,
    <a id="homeLink" target="_blank" rel="noopener noreferrer">livingmiracles.org</a>
  </footer>

  <dialog id="pwDialog">
    <form method="dialog" id="pwForm">
      <h2 id="pwTitle">Password</h2>
      <p id="pwMessage" class="muted"></p>
      <label>Password <span class="pw-field"><input type="password" id="pwInput" autocomplete="current-password" required><button type="button" class="reveal" aria-pressed="false" aria-label="Show password" title="Show password"><svg class="eye-on" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><svg class="eye-off" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path d="M3 3l18 18"/></svg></button></span></label>
      <label id="pwConfirmRow">Confirm password <span class="pw-field"><input type="password" id="pwConfirm" autocomplete="new-password"><button type="button" class="reveal" aria-pressed="false" aria-label="Show password" title="Show password"><svg class="eye-on" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><svg class="eye-off" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path d="M3 3l18 18"/></svg></button></span></label>
      <p id="pwError" class="error" role="alert"></p>
      <div class="dialog-actions">
        <button value="cancel" formnovalidate>Cancel</button>
        <button value="ok" class="primary" id="pwOk">OK</button>
      </div>
    </form>
  </dialog>

  <dialog id="choiceDialog">
    <form method="dialog">
      <h2 id="choiceTitle"></h2>
      <p id="choiceMessage"></p>
      <div class="dialog-actions" id="choiceButtons"></div>
    </form>
  </dialog>

  <input type="file" id="fileInput" accept=".enc,.txt,application/octet-stream" hidden>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="crypto.js"></script>
  <script src="instrument.js"></script>
  <script src="lists.js"></script>
  <script src="app.js"></script>
</body>
</html>
